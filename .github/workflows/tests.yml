name: Public source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # This tier needs no game assembly, model weights, or GPU.
      - run: python -m pytest -q tests
      - run: python -m compileall -q train/sts2ai scripts tools
  export-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      # Synthetic parameters only: no game files, published weights, or GPU. The trainer tests need torch too.
      - run: python -m pytest -q tests/test_export_metadata.py tests/test_route1_trainer.py tests/test_scripts.py
